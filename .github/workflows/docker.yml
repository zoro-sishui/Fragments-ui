name: Build & Push Fragments UI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: pkg
        run: echo "version=$(jq -r .version package.json)" >> $GITHUB_OUTPUT

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (amd64 only)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            princemagar/fragments-ui:latest
            princemagar/fragments-ui:${{ steps.pkg.outputs.version }}
          build-args: |
            API_URL=${{ vars.API_URL }}
            AWS_COGNITO_POOL_ID=${{ vars.AWS_COGNITO_POOL_ID }}
            AWS_COGNITO_CLIENT_ID=${{ vars.AWS_COGNITO_CLIENT_ID }}
            OAUTH_SIGN_IN_REDIRECT_URL=${{ vars.OAUTH_SIGN_IN_REDIRECT_URL }}
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.pkg.outputs.version }}

      - name: Summary
        run: |
          echo "Published UI image: princemagar/fragments-ui:latest and :${{ steps.pkg.outputs.version }}" >> $GITHUB_STEP_SUMMARY
