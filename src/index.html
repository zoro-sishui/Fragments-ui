<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fragments UI</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/dark.css" />
    <style>
      #create-fragment, #fragments-list {
        background: #333;
        padding: 20px;
        margin: 20px 0;
        border-radius: 5px;
        border: 1px solid #555;
        width: 100%;
        max-width: none;
      }
      
      #fragments-container {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        width: 100%;
        justify-content: flex-start;
      }
      
      #create-fragment-form div {
        width:100%;
        margin-bottom: 15px;
      }
      
      #create-fragment-form label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
      }
      
      #create-fragment-form select,
      #create-fragment-form textarea {
        width: 100%;
        padding: 8px;
        border: 1px solid black;
        border-radius: 4px;
        font-family: inherit;
      }
      
      #create-fragment-form textarea {
        resize: vertical;
        min-height: 120px;
      }
      
      .fragment-item {
        background: #444;
        border: 1px solid #666;
        padding: 15px;
        border-radius: 5px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 15px;
        flex: 1 1 300px;
        min-width: 300px;
        max-width: 500px;
      }
      
      .fragment-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
      }
      
      .fragment-actions button {
        flex-shrink: 0;
      }
      
      .delete-btn {
        background-color: #d32f2f;
        color: white;
      }
      
      .fragment-content {
        background: #222;
        padding: 10px;
        border-radius: 3px;
        white-space: pre-wrap;
        font-family: monospace;
        border: 1px solid #555;
        width: 100%;
        max-width: none;
        overflow-x: auto;
        min-height: 150px;
        box-sizing: border-box;
        flex: 1;
      }
      
      /* Success message styling */
      #create-result {
        margin-top: 15px;
        padding: 15px;
        border-radius: 5px;
        background: #333;
        color: black;
        border: 1px solid #555;
      }
      
      .fragment-header {
        display: flex;
        flex-wrap: wrap;
        gap: 15px;
        align-items: center;
        padding: 10px;
        background: var(--b-bg-2);
        border-radius: 5px;
        border: 1px solid var(--b-line);
      }
      
      .fragment-info {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        align-items: center;
        width: 100%;
      }
      
      .fragment-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 15px;
        font-size: 0.9em;
        color: var(--b-txt-2);
        width: 100%;
        justify-content: flex-start;
      }
      
      .fragment-detail {
        display: flex;
        align-items: center;
        gap: 8px;
        white-space: nowrap;
        min-width: fit-content;
        flex: 0 0 auto;
        padding: 5px 10px;
        background: var(--b-bg);
        border-radius: 4px;
        border: 1px solid var(--b-line);
      }
      
      .fragment-detail strong {
        color: white;
        font-weight: 600;
      }
    </style>
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <h1>Fragments UI</h1>
    <section>
      <nav>
        <button id="login">Login</button>
        <button id="logout" hidden>Logout</button>
      </nav>
    </section>
    <section hidden id="user">
      <h2>Hello <span class="username"></span>!</h2>
      
      <!-- Content Creation Section -->
      <section id="create-fragment">
        <h3>Create New Item</h3>
        <form id="create-fragment-form">
          <div>
            <label for="fragment-type">Content Type:</label>
            <select id="fragment-type" required>
              <option value="text/plain">Text (Plain)</option>
            </select>
          </div>
          <div>
            <label for="fragment-content">Content:</label>
            <textarea id="fragment-content" rows="6" cols="50" placeholder="Enter content here..." required></textarea>
          </div>
          <button type="submit">Create Item</button>
          <button type="button" id="clear-form">Clear</button>
        </form>
        <div id="create-result" style="margin-top: 10px;"></div>
      </section>

      <!-- Items List Section -->
      <section id="fragments-list">
        <h3>Items</h3>
        <div id="fragments-container">
          <p>Loading fragments...</p>
        </div>
      </section>
    </section>
  </body>
</html>
